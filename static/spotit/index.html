<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Spot It! 🎯</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e17;
      --surface: #1c1b2a;
      --surface2: #252436;
      --accent: #ff6b35;
      --accent2: #f7c59f;
      --text: #fffffe;
      --text2: #a7a9be;
      --green: #6bcb77;
      --red: #ff4d6d;
      --card-border: rgba(255,255,255,0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 680px;
      padding: 1rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; flex: 1; gap: 1rem; }
    .screen.active { display: flex; }

    /* ── Home ── */
    .logo {
      text-align: center;
      padding: 2rem 0 1rem;
    }
    .logo h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: -1px; }
    .logo p { color: var(--text2); margin-top: .3rem; }

    .card-box {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }
    .card-box h2 { font-size: 1rem; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

    input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: .65rem .9rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text2); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      padding: .7rem 1.2rem;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn.green { background: var(--green); color: #000; }
    .btn:disabled { opacity: .4; cursor: default; }

    .row { display: flex; gap: .6rem; }
    .row input { flex: 1; }

    /* ── Lobby ── */
    .room-code {
      text-align: center;
      padding: 1.2rem;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }
    .room-code .label { font-size: .8rem; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
    .room-code .code {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: .18em;
      color: var(--accent);
      font-family: 'Courier New', monospace;
    }
    .room-code .hint { font-size: .8rem; color: var(--text2); margin-top: .3rem; }

    .player-list { display: flex; flex-direction: column; gap: .5rem; }
    .player-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .6rem .9rem;
      background: var(--surface2);
      border-radius: 10px;
    }
    .player-item .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .player-item .crown { font-size: 1rem; }

    /* ── Game screen ── */
    .scoreboard {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .score-chip {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: .3rem .8rem;
      font-size: .85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .score-chip.me { border-color: var(--accent); background: rgba(255,107,53,.12); }
    .score-chip .pts { color: var(--accent); font-size: 1rem; }

    .game-arena {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      flex: 1;
    }

    /* Big cards side by side */
    .main-cards {
      display: flex;
      gap: .8rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }

    .card-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
    }
    .card-slot .slot-label {
      font-size: .75rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    /* ── Spot It Card ── */
    .spotit-card {
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2d2b45, #1a1828);
      border: 3px solid var(--card-border);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      cursor: default;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .spotit-card.interactive { cursor: pointer; }
    .spotit-card.interactive:hover {
      border-color: var(--accent);
      transform: scale(1.03);
      box-shadow: 0 0 24px rgba(255,107,53,.3);
    }
    .spotit-card.flash-good {
      animation: flashGood .4s ease;
    }
    .spotit-card.flash-bad {
      animation: flashBad .35s ease;
    }
    .spotit-card.focused {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255,107,53,.25);
    }

    @keyframes flashGood {
      0%   { box-shadow: 0 0 0 0 rgba(107,203,119,0); }
      30%  { box-shadow: 0 0 0 20px rgba(107,203,119,.6); border-color: var(--green); }
      100% { box-shadow: 0 0 0 0 rgba(107,203,119,0); }
    }
    @keyframes flashBad {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      60%  { transform: translateX(6px); }
    }

    .sym {
      position: absolute;
      transform-origin: center;
      line-height: 1;
      user-select: none;
      transition: transform .1s;
      cursor: default;
    }
    .sym.clickable { cursor: pointer; }
    .sym.clickable:hover { transform: scale(1.25) !important; filter: drop-shadow(0 0 6px rgba(255,255,255,.5)); }
    .sym.highlight {
      animation: symPop .35s ease;
    }
    @keyframes symPop {
      0%   { transform: scale(1) !important; }
      40%  { transform: scale(1.6) !important; }
      100% { transform: scale(1) !important; }
    }

    /* Tray */
    .tray-label {
      font-size: .75rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .tray {
      display: flex;
      gap: .7rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .tray-card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .25rem;
      cursor: pointer;
    }
    .tray-card-wrap .tray-name {
      font-size: .7rem;
      color: var(--text2);
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tray-card-wrap .spotit-card { transition: border-color .15s, transform .15s; }
    .tray-card-wrap:hover .spotit-card { border-color: var(--accent); transform: scale(1.08); }
    .tray-card-wrap.active .spotit-card { border-color: var(--accent); box-shadow: 0 0 14px rgba(255,107,53,.3); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: .7rem 1.4rem;
      font-weight: 600;
      transition: transform .3s cubic-bezier(.22,1,.36,1);
      z-index: 100;
      text-align: center;
      min-width: 200px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.good { border-color: var(--green); color: var(--green); }
    #toast.bad  { border-color: var(--red);  color: var(--red); }

    /* Status badge */
    .status-badge {
      text-align: center;
      padding: .5rem;
      font-size: .85rem;
      color: var(--text2);
      border-radius: 8px;
    }
    .status-badge.waiting { color: var(--accent2); }

    /* Divider */
    .vs-label {
      font-size: .8rem;
      color: var(--text2);
      font-weight: 700;
      align-self: center;
      flex-shrink: 0;
    }

    /* End screen */
    .podium { display: flex; flex-direction: column; gap: .5rem; margin: 1rem 0; }
    .podium-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }
    .podium-row.winner { border-color: gold; background: rgba(255,215,0,.08); }
    .podium-row .rank { font-size: 1.3rem; width: 2rem; }
    .podium-row .pname { flex: 1; font-weight: 600; }
    .podium-row .pscore { font-size: 1.2rem; font-weight: 800; color: var(--accent); }

    @media (max-width: 480px) {
      .main-cards { gap: .5rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="logo">
      <h1>🎯 Spot It!</h1>
      <p>Find the one symbol your cards share</p>
    </div>
    <div class="card-box">
      <h2>Your name</h2>
      <input type="text" id="home-name" placeholder="Enter your name" maxlength="20">
    </div>
    <div class="card-box">
      <h2>Create a room</h2>
      <button class="btn" id="btn-create">Create Room</button>
    </div>
    <div class="card-box">
      <h2>Join a room</h2>
      <div class="row">
        <input type="text" id="home-code" placeholder="Room code (e.g. XKCD42)" maxlength="8" style="text-transform:uppercase">
        <button class="btn secondary" id="btn-join">Join</button>
      </div>
    </div>
    <div id="home-error" style="color:var(--red);text-align:center;font-size:.9rem;min-height:1.2rem;"></div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <div class="logo" style="padding:1.2rem 0 .5rem">
      <h1 style="font-size:1.6rem">Waiting for players…</h1>
    </div>
    <div class="room-code">
      <div class="label">Room code</div>
      <div class="code" id="lobby-code">------</div>
      <div class="hint">Share this with your friends</div>
    </div>
    <div class="card-box">
      <h2>Players <span id="lobby-count" style="color:var(--accent)"></span></h2>
      <div class="player-list" id="lobby-players"></div>
    </div>
    <button class="btn green" id="btn-start" disabled>Start Game</button>
    <button class="btn secondary" id="btn-leave-lobby">Leave</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="scoreboard" id="scoreboard"></div>

    <div class="main-cards" id="main-cards">
      <div class="card-slot">
        <div class="slot-label">Your card</div>
        <div id="my-card-wrap"></div>
      </div>
      <div class="vs-label">VS</div>
      <div class="card-slot">
        <div class="slot-label" id="focus-label">Pick a card →</div>
        <div id="focus-card-wrap"></div>
      </div>
    </div>

    <div class="tray-label" id="tray-label" style="display:none">Other players</div>
    <div class="tray" id="tray"></div>
    <div class="status-badge waiting" id="game-status"></div>
  </div>

  <!-- END -->
  <div id="screen-end" class="screen">
    <div class="logo" style="padding:1.5rem 0 .5rem">
      <h1 style="font-size:1.8rem">Game Over! 🏆</h1>
    </div>
    <div class="podium" id="podium"></div>
    <button class="btn green" id="btn-play-again">Play Again</button>
    <button class="btn secondary" id="btn-leave-end">Leave</button>
  </div>

</div>

<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';

// ─── CONSTANTS ───────────────────────────────────────────────────────────────

const EMOJIS = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼',
  '🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔',
  '🐧','🦆','🦅','🦉','🦇','🐺','🐗','🐴',
  '🦄','🐝','🦋','🐌','🐞','🐜','🦟','🐢',
  '🐍','🦎','🐙','🦑','🦀','🐡','🐠','🐟',
  '🐬','🐳','🦈','🐊','🐅','🐆','🦓','🦍',
  '🌵','🌲','🌴','🌺','🌸','🍄','🍎','🍋',
  '🍇',
];

// ─── SPOT IT CARD GENERATION (projective plane of order 7) ───────────────────
// 57 cards, 8 symbols each, any two cards share exactly 1 symbol.

function generateDeck() {
  const n = 7;
  const cards = [];

  // Card 0: symbols 0..7
  cards.push(Array.from({length: n + 1}, (_, i) => i));

  // Cards 1..7
  for (let i = 0; i < n; i++) {
    const card = [0];
    for (let j = 0; j < n; j++) card.push(n + 1 + i * n + j);
    cards.push(card);
  }

  // Cards 8..56
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const card = [i + 1];
      for (let k = 0; k < n; k++) card.push(n + 1 + k * n + (j + i * k) % n);
      cards.push(card);
    }
  }

  return cards; // 57 cards × 8 symbols
}

const DECK = generateDeck();

function findMatch(cardA, cardB) {
  const setB = new Set(cardB);
  return cardA.find(s => setB.has(s));
}

// ─── SEEDED RNG (LCG) ────────────────────────────────────────────────────────

function makeRng(seed) {
  let s = (seed * 1664525 + 1013904223) >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 0xFFFFFFFF;
  };
}

// ─── CARD LAYOUT ─────────────────────────────────────────────────────────────
// Returns an array of 8 {x,y,size,rot} objects (x,y in % of card diameter).

function getLayout(cardIdx) {
  const rng = makeRng(cardIdx + 1);
  // Layers: 1 center, 3 inner, 4 outer
  const configs = [
    [0,    0                       ],  // center
    [0.40, 0                       ],  // inner ring ×3
    [0.40, (2 / 3) * Math.PI * 2  ],
    [0.40, (4 / 3) * Math.PI * 2  ],
    [0.75, 0                       ],  // outer ring ×4
    [0.75, (1 / 4) * Math.PI * 2  ],
    [0.75, (2 / 4) * Math.PI * 2  ],
    [0.75, (3 / 4) * Math.PI * 2  ],
  ];
  const angleOffset = rng() * Math.PI * 2;
  return configs.map(([r, baseAngle]) => {
    const angle = baseAngle + angleOffset + (rng() - .5) * .55;
    const rJitter = r + (rng() - .5) * .07;
    return {
      x: 50 + rJitter * 46 * Math.cos(angle),
      y: 50 + rJitter * 46 * Math.sin(angle),
      size: .72 + rng() * .58,
      rot: (rng() - .5) * 40,
    };
  });
}

// ─── CARD RENDERER ───────────────────────────────────────────────────────────

function buildCard(deckIdx, sizePx, {interactive = false, clickableSym = false, onSymClick} = {}) {
  const symbols = DECK[deckIdx];
  const layout = getLayout(deckIdx);
  const baseFontPx = sizePx * 0.175;

  const el = document.createElement('div');
  el.className = 'spotit-card' + (interactive ? ' interactive' : '');
  el.style.width = el.style.height = sizePx + 'px';

  symbols.forEach((symIdx, i) => {
    const pos = layout[i];
    const span = document.createElement('span');
    span.className = 'sym' + (clickableSym ? ' clickable' : '');
    span.textContent = EMOJIS[symIdx];
    span.dataset.sym = symIdx;
    span.style.cssText = `
      left:${pos.x}%;
      top:${pos.y}%;
      font-size:${(baseFontPx * pos.size).toFixed(1)}px;
      transform:translate(-50%,-50%) rotate(${pos.rot.toFixed(1)}deg);
    `;
    if (clickableSym && onSymClick) {
      span.addEventListener('click', e => { e.stopPropagation(); onSymClick(symIdx, span); });
    }
    el.appendChild(span);
  });

  return el;
}

// ─── UTILS ───────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function roomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2200);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setError(msg) {
  document.getElementById('home-error').textContent = msg;
}

// ─── GAME STATE ──────────────────────────────────────────────────────────────

const G = {
  myId: null,       // PeerJS ID
  myName: '',
  isHost: false,
  peer: null,       // PeerJS Peer
  conns: {},        // peerId → DataConnection (host only)
  hostConn: null,   // DataConnection to host (guest only)
  roomId: '',

  // Authoritative state (maintained by host, replicated to guests)
  state: null,
  /*
    state = {
      status: 'waiting' | 'playing' | 'finished',
      shuffledDeck: number[],   // 57 shuffled indices into DECK
      players: {
        [peerId]: { name, cardPos, score, online }
      },
      hostId: string,
    }
  */

  focusedPeerId: null,  // whose card is shown in the focus slot
};

// ─── NETWORKING ──────────────────────────────────────────────────────────────

function broadcast(msg) {
  Object.values(G.conns).forEach(c => { try { c.send(msg); } catch(_) {} });
}

function sendToHost(msg) {
  if (G.isHost) handleHostMessage(G.myId, msg);
  else { try { G.hostConn.send(msg); } catch(_) {} }
}

// Host handles messages from any peer
function handleHostMessage(fromId, msg) {
  if (!G.isHost) return;
  const st = G.state;

  if (msg.type === 'join') {
    if (st.status !== 'waiting') return;
    st.players[fromId] = { name: msg.name, cardPos: 0, score: 0, online: true };
    pushState();
    return;
  }

  if (msg.type === 'match') {
    if (st.status !== 'playing') return;
    const player = st.players[fromId];
    const opponent = st.players[msg.opponentId];
    if (!player || !opponent) return;

    const myCard   = st.shuffledDeck[player.cardPos   % st.shuffledDeck.length];
    const oppCard  = st.shuffledDeck[opponent.cardPos % st.shuffledDeck.length];
    const real     = findMatch(DECK[myCard], DECK[oppCard]);

    if (real !== msg.symbol) {
      // Wrong — tell only the claimer
      try {
        if (fromId === G.myId) handleStateUpdate({ type: 'wrong' });
        else G.conns[fromId]?.send({ type: 'wrong' });
      } catch(_) {}
      return;
    }

    player.score++;
    player.cardPos++;
    pushState();
    return;
  }

  if (msg.type === 'start' && fromId === st.hostId) {
    if (st.status !== 'waiting' || Object.keys(st.players).length < 2) return;
    st.status = 'playing';
    // Assign each player a staggered start position so no two share the same card immediately
    const ids = Object.keys(st.players);
    ids.forEach((id, i) => { st.players[id].cardPos = i * 7; });
    pushState();
    return;
  }

  if (msg.type === 'restart' && fromId === st.hostId) {
    st.status = 'waiting';
    st.shuffledDeck = shuffle(Array.from({length: 57}, (_, i) => i));
    Object.values(st.players).forEach(p => { p.score = 0; p.cardPos = 0; });
    pushState();
    return;
  }
}

function pushState() {
  const msg = { type: 'state', state: G.state };
  broadcast(msg);
  handleStateUpdate(msg); // host applies locally too
}

// Everyone (host + guests) applies state updates here
function handleStateUpdate(msg) {
  if (msg.type === 'wrong') {
    toast('❌ Not a match!', 'bad');
    const wrap = document.getElementById('my-card-wrap');
    wrap?.querySelector('.spotit-card')?.classList.add('flash-bad');
    setTimeout(() => wrap?.querySelector('.spotit-card')?.classList.remove('flash-bad'), 400);
    return;
  }

  if (msg.type === 'state') {
    const prev = G.state?.status;
    G.state = msg.state;

    if (msg.state.status === 'waiting' && prev !== 'waiting') {
      renderLobby();
      showScreen('screen-lobby');
      return;
    }
    if (msg.state.status === 'playing') {
      renderGame();
      if (prev !== 'playing') showScreen('screen-game');
      return;
    }
    if (msg.state.status === 'finished') {
      renderEnd();
      showScreen('screen-end');
      return;
    }
    if (msg.state.status === 'waiting') {
      renderLobby();
    }
  }
}

// ─── PEER SETUP ──────────────────────────────────────────────────────────────

function initPeer(desiredId) {
  return new Promise((resolve, reject) => {
    const peer = desiredId ? new Peer(desiredId) : new Peer();
    peer.on('open', id => resolve({ peer, id }));
    peer.on('error', err => reject(err));
  });
}

async function createRoom() {
  const name = document.getElementById('home-name').value.trim() || 'Player';
  G.myName = name;
  const code = roomCode();
  G.roomId = code;

  setError('Connecting…');
  try {
    const { peer, id } = await initPeer(code);
    G.peer = peer;
    G.myId = id;
    G.isHost = true;

    G.state = {
      status: 'waiting',
      shuffledDeck: shuffle(Array.from({length: 57}, (_, i) => i)),
      players: {},
      hostId: id,
    };
    // Host joins themselves
    G.state.players[id] = { name, cardPos: 0, score: 0, online: true };

    peer.on('connection', conn => {
      conn.on('open', () => {
        G.conns[conn.peer] = conn;
        // Send current state to newcomer
        conn.send({ type: 'state', state: G.state });
      });
      conn.on('data', msg => handleHostMessage(conn.peer, msg));
      conn.on('close', () => {
        delete G.conns[conn.peer];
        if (G.state.players[conn.peer]) {
          G.state.players[conn.peer].online = false;
          pushState();
        }
      });
    });

    setError('');
    renderLobby();
    showScreen('screen-lobby');
  } catch (err) {
    setError('Could not create room. Try again.');
    console.error(err);
  }
}

async function joinRoom() {
  const name = document.getElementById('home-name').value.trim() || 'Player';
  const code = document.getElementById('home-code').value.trim().toUpperCase();
  if (!code) { setError('Enter a room code.'); return; }

  G.myName = name;
  G.roomId = code;
  G.isHost = false;

  setError('Connecting…');
  try {
    const { peer, id } = await initPeer(null);
    G.peer = peer;
    G.myId = id;

    const conn = peer.connect(code, { reliable: true });
    G.hostConn = conn;

    await new Promise((resolve, reject) => {
      conn.on('open', resolve);
      conn.on('error', reject);
      setTimeout(() => reject(new Error('timeout')), 8000);
    });

    conn.on('data', msg => handleStateUpdate(msg));
    conn.on('close', () => toast('Disconnected from room', 'bad'));

    // Tell host our name
    conn.send({ type: 'join', name });
    setError('');
  } catch (err) {
    setError('Could not connect. Check the room code.');
    G.peer?.destroy();
    console.error(err);
  }
}

// ─── LOBBY RENDERING ─────────────────────────────────────────────────────────

function renderLobby() {
  const st = G.state;
  document.getElementById('lobby-code').textContent = G.roomId;

  const players = Object.entries(st.players).filter(([,p]) => p.online !== false);
  document.getElementById('lobby-count').textContent = `(${players.length})`;

  const list = document.getElementById('lobby-players');
  list.innerHTML = '';
  players.forEach(([id, p]) => {
    const div = document.createElement('div');
    div.className = 'player-item';
    div.innerHTML = `
      <span class="dot"></span>
      ${id === st.hostId ? '<span class="crown">👑</span>' : ''}
      <span>${p.name}${id === G.myId ? ' (you)' : ''}</span>
    `;
    list.appendChild(div);
  });

  const startBtn = document.getElementById('btn-start');
  startBtn.disabled = !G.isHost || players.length < 2;
  startBtn.style.display = G.isHost ? '' : 'none';
}

// ─── GAME RENDERING ──────────────────────────────────────────────────────────

function renderGame() {
  const st = G.state;
  const me = st.players[G.myId];
  if (!me) return;

  const myDeckIdx = st.shuffledDeck[me.cardPos % st.shuffledDeck.length];
  const opponents = Object.entries(st.players).filter(([id, p]) => id !== G.myId && p.online !== false);

  // Auto-focus first opponent if none focused or focused left
  if (!G.focusedPeerId || !st.players[G.focusedPeerId]) {
    G.focusedPeerId = opponents[0]?.[0] ?? null;
  }

  // Scoreboard
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  Object.entries(st.players).filter(([,p]) => p.online !== false).forEach(([id, p]) => {
    const chip = document.createElement('div');
    chip.className = 'score-chip' + (id === G.myId ? ' me' : '');
    chip.innerHTML = `<span>${p.name}${id === G.myId ? ' (you)' : ''}</span><span class="pts">${p.score}</span>`;
    sb.appendChild(chip);
  });

  // My card
  const myWrap = document.getElementById('my-card-wrap');
  myWrap.innerHTML = '';
  myWrap.appendChild(buildCard(myDeckIdx, 200, {
    clickableSym: !!G.focusedPeerId,
    onSymClick: (sym, el) => handleSymClick(sym, el, 'mine'),
  }));

  // Focused opponent card
  const focusWrap = document.getElementById('focus-card-wrap');
  const focusLabel = document.getElementById('focus-label');
  focusWrap.innerHTML = '';

  if (G.focusedPeerId) {
    const opp = st.players[G.focusedPeerId];
    const oppDeckIdx = st.shuffledDeck[opp.cardPos % st.shuffledDeck.length];
    focusLabel.textContent = opp.name + "'s card";
    const focCard = buildCard(oppDeckIdx, 200, {
      clickableSym: true,
      onSymClick: (sym, el) => handleSymClick(sym, el, 'focus'),
    });
    focCard.classList.add('focused');
    focusWrap.appendChild(focCard);
  } else {
    focusLabel.textContent = 'Pick a card →';
    const placeholder = document.createElement('div');
    placeholder.style.cssText = 'width:200px;height:200px;border-radius:50%;border:3px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:.85rem;text-align:center;padding:1rem;';
    placeholder.textContent = 'Click a player\'s card below';
    focusWrap.appendChild(placeholder);
  }

  // Tray
  const tray = document.getElementById('tray');
  const trayLabel = document.getElementById('tray-label');
  tray.innerHTML = '';

  if (opponents.length > 0) {
    trayLabel.style.display = '';
    opponents.forEach(([id, p]) => {
      const oppDeckIdx = st.shuffledDeck[p.cardPos % st.shuffledDeck.length];
      const wrap = document.createElement('div');
      wrap.className = 'tray-card-wrap' + (id === G.focusedPeerId ? ' active' : '');
      const nameEl = document.createElement('div');
      nameEl.className = 'tray-name';
      nameEl.textContent = p.name;
      const card = buildCard(oppDeckIdx, 80, { interactive: true });
      wrap.appendChild(card);
      wrap.appendChild(nameEl);
      wrap.addEventListener('click', () => {
        G.focusedPeerId = id;
        renderGame();
      });
      tray.appendChild(wrap);
    });
  } else {
    trayLabel.style.display = 'none';
    document.getElementById('game-status').textContent = 'Waiting for other players to join…';
  }

  // Check if deck exhausted → game over
  const maxPos = Math.max(...Object.values(st.players).map(p => p.cardPos));
  if (maxPos >= st.shuffledDeck.length - 1 && G.isHost) {
    setTimeout(() => {
      G.state.status = 'finished';
      pushState();
    }, 1200);
  }
}

// ─── SYMBOL CLICK HANDLER ────────────────────────────────────────────────────

function handleSymClick(sym, el, source) {
  if (!G.focusedPeerId) return;
  const st = G.state;
  const me = st.players[G.myId];
  const opp = st.players[G.focusedPeerId];
  if (!me || !opp) return;

  const myCard  = DECK[st.shuffledDeck[me.cardPos  % st.shuffledDeck.length]];
  const oppCard = DECK[st.shuffledDeck[opp.cardPos % st.shuffledDeck.length]];

  const inBoth = myCard.includes(sym) && oppCard.includes(sym);
  if (inBoth) {
    el.classList.add('highlight');
    setTimeout(() => el.classList.remove('highlight'), 400);
    sendToHost({ type: 'match', opponentId: G.focusedPeerId, symbol: sym });
    toast('🎉 Found it!', 'good');
  } else {
    toast('❌ Not a match!', 'bad');
    const card = source === 'mine'
      ? document.getElementById('my-card-wrap').querySelector('.spotit-card')
      : document.getElementById('focus-card-wrap').querySelector('.spotit-card');
    card?.classList.add('flash-bad');
    setTimeout(() => card?.classList.remove('flash-bad'), 400);
  }
}

// ─── END SCREEN ──────────────────────────────────────────────────────────────

function renderEnd() {
  const st = G.state;
  const sorted = Object.entries(st.players)
    .sort(([,a],[,b]) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  sorted.forEach(([id, p], i) => {
    const row = document.createElement('div');
    row.className = 'podium-row' + (i === 0 ? ' winner' : '');
    row.innerHTML = `
      <span class="rank">${medals[i] || (i + 1) + '.'}</span>
      <span class="pname">${p.name}${id === G.myId ? ' (you)' : ''}</span>
      <span class="pscore">${p.score} pts</span>
    `;
    podium.appendChild(row);
  });
  document.getElementById('btn-play-again').style.display = G.isHost ? '' : 'none';
}

// ─── EVENT WIRING ────────────────────────────────────────────────────────────

document.getElementById('btn-create').addEventListener('click', createRoom);

document.getElementById('btn-join').addEventListener('click', joinRoom);

document.getElementById('home-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});

document.getElementById('btn-start').addEventListener('click', () => {
  sendToHost({ type: 'start' });
});

document.getElementById('btn-leave-lobby').addEventListener('click', () => {
  G.peer?.destroy();
  Object.assign(G, { myId: null, isHost: false, peer: null, conns: {}, hostConn: null, state: null });
  showScreen('screen-home');
});

document.getElementById('btn-play-again').addEventListener('click', () => {
  sendToHost({ type: 'restart' });
});

document.getElementById('btn-leave-end').addEventListener('click', () => {
  G.peer?.destroy();
  Object.assign(G, { myId: null, isHost: false, peer: null, conns: {}, hostConn: null, state: null });
  showScreen('screen-home');
});
</script>
