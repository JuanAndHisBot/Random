<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Learning System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><a href="{{ url_for('main.index') }}">📚 Daily Learning</a></h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('main.today') }}">Today</a></li>
                    <li><a href="{{ url_for('main.archive') }}">Archive</a></li>
                    <li><a href="{{ url_for('main.progress') }}">Progress</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p>Daily learning through guided discovery · Powered by Claude</p>
    </footer>

    <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
